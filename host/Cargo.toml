[package]
name = "gs-host"
version = "0.1.0"
edition = "2024"

[dependencies]
sat_core    = { package = "sat-core",    git = "https://github.com/MargaritaUlko/lorasat", branch = "master" }
sat_drivers = { package = "sat-drivers", git = "https://github.com/MargaritaUlko/lorasat", branch = "master" }

embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util"] }
tokio-serial = "5.4"
postcard = { version = "1.1.3", default-features = false }
log = "0.4"
env_logger = "0.11"
defmt = "1.0.1"
